
name: Import Hysteris Builder Snapshot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest

    steps:
      - name: Install Git LFS
        run: |
          sudo apt-get update
          sudo apt-get install -y git-lfs rsync
          git lfs install

      - name: Checkout migration workflow
        uses: actions/checkout@v4

      - name: Validate destination
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          EXPECTED_REPOSITORY="inandipexel-svg/kernel_builder_mt6768"

          if [ "$GITHUB_REPOSITORY" != "$EXPECTED_REPOSITORY" ]; then
            echo "ERROR: This workflow is running in the wrong repository."
            echo "Expected: $EXPECTED_REPOSITORY"
            echo "Found: $GITHUB_REPOSITORY"
            exit 1
          fi

          REMOTE_BRANCHES=$(git ls-remote origin refs/heads/bore/v7.1)

          if [ -n "$REMOTE_BRANCHES" ]; then
            echo "ERROR: bore/v7.1 already exists in destination."
            exit 1
          fi

          cp .github/workflows/import-builder.yml \
            "$RUNNER_TEMP/import-builder.yml"

          echo "Destination validated successfully."

      - name: Prepare bore/v7.1 snapshot
        run: |
          set -euo pipefail

          mkdir -p "$RUNNER_TEMP/builder-snapshot"

          git clone --depth 1 --single-branch \
            --branch bore/v7.1 \
            https://github.com/a03corerooted-dev-ctrl/NonGKI_Kernel_Build-K419.git \
            "$RUNNER_TEMP/source-builder"

          git -C "$RUNNER_TEMP/source-builder" lfs pull

          SOURCE_COMMIT=$(git -C "$RUNNER_TEMP/source-builder" rev-parse HEAD)

          rsync -a --exclude='.git' \
            "$RUNNER_TEMP/source-builder/" \
            "$RUNNER_TEMP/builder-snapshot/"

          rm -f "$RUNNER_TEMP/builder-snapshot/.lfsconfig"

          mkdir -p "$RUNNER_TEMP/builder-snapshot/.github/workflows"

          cp "$RUNNER_TEMP/import-builder.yml" \
            "$RUNNER_TEMP/builder-snapshot/.github/workflows/import-builder.yml"

          cd "$RUNNER_TEMP/builder-snapshot"

          git init -b bore/v7.1
          git lfs install --local

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add --all
          git commit -m "Initial builder snapshot from bore/v7.1"

          echo "SOURCE_COMMIT=$SOURCE_COMMIT" >> "$GITHUB_ENV"
          echo "BUILDER_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Push builder snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          AUTH=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          HEADER="AUTHORIZATION: basic $AUTH"

          git -C "$RUNNER_TEMP/builder-snapshot" remote add origin \
            "https://github.com/${GITHUB_REPOSITORY}.git"

          git -C "$RUNNER_TEMP/builder-snapshot" \
            config http.https://github.com/.extraheader "$HEADER"

          echo "Uploading Git LFS objects..."
          git -C "$RUNNER_TEMP/builder-snapshot" lfs push --all origin

          echo "Pushing bore/v7.1..."
          git -C "$RUNNER_TEMP/builder-snapshot" \
            push origin HEAD:refs/heads/bore/v7.1

          echo "Builder snapshot imported successfully."
          echo "Source commit: $SOURCE_COMMIT"
          echo "Destination commit: $BUILDER_COMMIT"
