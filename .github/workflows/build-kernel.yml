name: Build Kernel
on:
  push:
    branches:
      - bore-scheduler
      - test/spf-419-enabled
      - test/spf-419-disabled
      - test/combo-lru-reclaim
      - test/samsung-oem-tuning
      - test/stuff
  workflow_dispatch:
    inputs:
      select_device:
        description: 'Select device:'
        required: true
        type: choice
        default: 'merlin'
        options:
        - 'lancelot'
        - 'merlin'
        - 'selene'
      build_ksun:
        description: 'Build KernelSU-Next A13+'
        required: true
        default: false
        type: boolean
      build_ksun_old:
        description: 'Build KernelSU-Next A11+'
        required: true
        default: false
        type: boolean
      build_xxksu:
        description: 'Build xxksu A13+'
        required: true
        default: true
        type: boolean
      build_xxksu_old:
        description: 'Build xxksu A11+'
        required: true
        default: false
        type: boolean

jobs:
  generate-build-matrix:
    name: What to build?
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - id: set
        name: Generate build matrix
        run: |
          targets=()
          if [[ "${{ github.event_name }}" == "push" ]]; then
            # Keep branch-push validation focused: one Android 13+ xxksu build.
            targets+=("xxksu")
          else
            if [[ "${{ github.event.inputs.build_ksun }}" == "true" ]]; then targets+=("ksun"); fi
            if [[ "${{ github.event.inputs.build_ksun_old }}" == "true" ]]; then targets+=("ksun-old"); fi
            if [[ "${{ github.event.inputs.build_xxksu }}" == "true" ]]; then targets+=("xxksu"); fi
            if [[ "${{ github.event.inputs.build_xxksu_old }}" == "true" ]]; then targets+=("xxksu-old"); fi
          fi
          json=$(printf '%s\n' "${targets[@]}" | jq -R . | jq -s '{target: .}')
          echo "matrix<<EOF" >> $GITHUB_OUTPUT
          echo "$json" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

  build:
    needs: generate-build-matrix
    runs-on: ubuntu-latest
    env:
      DEVICE: ${{ github.event.inputs.select_device || 'merlin' }}
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"
    strategy:
      fail-fast: false
      matrix: ${{ fromJson(needs.generate-build-matrix.outputs.matrix) }}
    steps:
    - uses: actions/checkout@v5

    - name: Maximize build space
      if: env.REMOVE_UNUSED_PACKAGES == 'true'
      uses: easimon/maximize-build-space@master
      with:
        root-reserve-mb: 8192
        temp-reserve-mb: 2048
        remove-dotnet: 'true'
        remove-android: 'true'
        remove-haskell: 'true'
        remove-codeql: 'true'

    - name: Prepare environment
      run: |
        TARGET_CONFIG_FILENAME="${{ matrix.target }}"
        TARGET_CONFIG_FILENAME="${TARGET_CONFIG_FILENAME/-old/}"
        TARGET_CONFIG_FILENAME_SUFFIX=$TARGET_CONFIG_FILENAME
        grep -v -E "^#|^\n" config-${TARGET_CONFIG_FILENAME_SUFFIX}.env | sed 's/ #.*//; s/#.*//' >> $GITHUB_ENV
        if [[ "${{ matrix.target }}" == *"-old" ]]; then
            echo "ANDROID_TAG=[A11+]" >> $GITHUB_ENV
        else
            echo "ANDROID_TAG=[A13+]" >> $GITHUB_ENV
        fi

    - name: Check if old Android build
      if: contains(matrix.target, 'old')
      run: |
        echo "OLD_ANDROID_SUPPORT=true" >> $GITHUB_ENV

    - name: Set swap to 10G
      uses: pierotofy/set-swap-space@master
      with:
        swap-size-gb: 10

    - name: Setup kernel build environment
      run: |
        echo "BUILD_TIME=$(TZ=Asia/Dhaka date "+%Y%m%d%H%M")" >> $GITHUB_ENV
        sudo apt-get update
        # libxml2-utils pulls in the matching XML runtime for the runner release.
        sudo apt-get install -y bc bison build-essential ccache curl flex g++-multilib gcc-multilib git git-lfs gnupg gperf imagemagick lib32ncurses-dev lib32readline-dev lib32z1-dev lz4 libncurses6 libncurses-dev libsdl1.2-dev libssl-dev libwxgtk3.2-dev libxml2-utils lzop pngcrush rsync schedtool squashfs-tools xsltproc zip zlib1g-dev
        mkdir -p $GITHUB_WORKSPACE/kernel_workspace

    - name: Install python2
      if: env.ENABLE_PYTHON2 == 'true'
      run: |
        mkdir -p ~/python2-jammy && cd ~/python2-jammy
        wget http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7_2.7.18-13ubuntu1.5_amd64.deb
        wget http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-stdlib_2.7.18-13ubuntu1.5_amd64.deb
        wget http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/python2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb
        wget http://security.ubuntu.com/ubuntu/pool/universe/p/python2.7/libpython2.7-minimal_2.7.18-13ubuntu1.5_amd64.deb
        sudo apt install libnsl2 -y
        sudo dpkg -i libpython2.7-minimal_*.deb
        sudo dpkg -i python2.7-minimal_*.deb
        sudo dpkg -i libpython2.7-stdlib_*.deb
        sudo dpkg -i python2.7_*.deb
        sudo apt --fix-broken install
        sudo ln -s /usr/bin/python2.7 /usr/local/bin/python2
        rm -rf ~/python2-jammy

    - name: Download Clang
      if: env.USE_CLANG == 'true' && env.USE_GCC != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.CLANG_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O clang.tar.gz ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -zxvf clang.tar.gz
            rm clang.tar.gz
        elif [[ ${{ env.CLANG_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O clang.tar.xz ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -Jxvf clang.tar.xz
            rm clang.tar.xz
        elif [[ ${{ env.CLANG_SOURCE }} == *'.tar.zst' ]]; then
            wget -nv -O clang.tar.zst ${{ env.CLANG_SOURCE }}
            mkdir clang
            tar -C clang/ -I zstd -xf clang.tar.zst
            rm clang.tar.zst
        elif [[ ${{ env.CLANG_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.CLANG_SOURCE }} -b ${{ env.CLANG_BRANCH }} clang --depth=1
        else
            wget -nv -O clang.zip ${{ env.CLANG_SOURCE }}
            mkdir clang
            unzip clang.zip -d clang/
        fi
        if [[ "$(find ./clang -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
            mv -f "$(find ./clang -mindepth 1 -maxdepth 1 -type d)"/* ./clang
        fi

    - name: Download GCC
      if: env.USE_GCC == 'true' && env.USE_CLANG != 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [ ${{ env.USE_GCC_64 }} = true ]; then
            if [[ ${{ env.GCC_64_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-64.tar.gz ${{ env.GCC_64_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -zxvf gcc-64.tar.gz
                rm gcc-64.tar.gz
            elif [[ ${{ env.GCC_64_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-64.xz ${{ env.GCC_64_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -Jxvf gcc-64.xz
                rm gcc-64.tar.xz
            elif [[ ${{ env.GCC_64_SOURCE }} == *'.tar.zst' ]]; then
                wget -nv -O gcc-64.tar.zst ${{ env.GCC_64_SOURCE }}
                mkdir gcc-64
                tar -C gcc-64/ -I zstd -xf gcc-64.tar.zst
                rm gcc-64.tar.zst
            elif [[ ${{ env.GCC_64_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.GCC_64_SOURCE }} -b ${{ env.GCC_64_BRANCH }} gcc-64 --depth=1
            else
                wget -nv -O gcc-64.zip ${{ env.GCC_64_SOURCE }}
                mkdir gcc-64
                unzip gcc-64.zip -d gcc-64/
                rm gcc-64.zip
            fi
            if [[ "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-64 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-64
            fi
        fi
        if [ ${{ env.USE_GCC_32 }} = true ]; then
            if [[ ${{ env.GCC_32_SOURCE }} == *'.tar.gz' ]]; then
                wget -nv -O gcc-32.tar.gz ${{ env.GCC_32_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -zxvf gcc-32.tar.gz
                rm gcc-32.tar.gz
            elif [[ ${{ env.GCC_32_SOURCE }} == *'.tar.xz' ]]; then
                wget -nv -O gcc-32.xz ${{ env.GCC_32_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -Jxvf gcc-32.xz
                rm gcc-32.tar.xz
            elif [[ ${{ env.GCC_32_SOURCE }} == *'.tar.zst' ]]; then
                wget -nv -O gcc-32.tar.zst ${{ env.GCC_32_SOURCE }}
                mkdir gcc-32
                tar -C gcc-32/ -I zstd -xf gcc-32.tar.zst
                rm gcc-32.tar.zst
            elif [[ ${{ env.GCC_32_SOURCE }} == *'.git' ]]; then
                git clone ${{ env.GCC_32_SOURCE }} -b ${{ env.GCC_32_BRANCH }} gcc-32 --depth=1
            else
                wget -nv -O gcc-32.zip ${{ env.GCC_32_SOURCE }}
                mkdir gcc-32
                unzip gcc-32.zip -d gcc-32/
                rm gcc-32.zip
            fi
            if [[ "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d | wc -l)" == "1" ]]; then
                mv -f "$(find ./gcc-32 -mindepth 1 -maxdepth 1 -type d)"/* ./gcc-32
            fi
        fi

    - name: Download mkbootimg tools
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone https://android.googlesource.com/platform/system/tools/mkbootimg tools -b master-kernel-build-2022 --depth=1

    - name: Download kernel source
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        git clone --recursive ${{ env.KERNEL_SOURCE }} -b ${{ env.KERNEL_SOURCE_BRANCH }} android-kernel --depth=1
        cd android-kernel
        ACTUAL_KERNEL_SOURCE_SHA="$(git rev-parse HEAD)"
        echo "Kernel source branch: ${KERNEL_SOURCE_BRANCH}"
        echo "Kernel source commit: ${ACTUAL_KERNEL_SOURCE_SHA}"
        git log -1 --format='Kernel source subject: %s'
        if [ -n "${KERNEL_SOURCE_EXPECTED_SHA:-}" ] && [ "$ACTUAL_KERNEL_SOURCE_SHA" != "$KERNEL_SOURCE_EXPECTED_SHA" ]; then
            echo "Kernel source SHA mismatch: expected $KERNEL_SOURCE_EXPECTED_SHA, got $ACTUAL_KERNEL_SOURCE_SHA"
            exit 1
        fi
        if [ -n "${KERNEL_SOURCE_EXPECTED_SHA:-}" ]; then
            echo "PASS: kernel source SHA matches the experimental reclaim target"
        fi

    - name: Download source boot image
      if: env.BUILD_BOOT_IMG == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        wget -nv -O boot-source.img ${{ env.SOURCE_BOOT_IMAGE }}
        if [ -f boot-source.img ]; then
            echo "FORMAT_MKBOOTING=$(echo `tools/unpack_bootimg.py --boot_img=boot-source.img --format mkbootimg`)" >> $GITHUB_ENV
            echo "HAVE_SOURCE_BOOT_IMAGE=true" >> $GITHUB_ENV
        fi

    - name: Setup KernelSU
      if: env.ENABLE_KERNELSU == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        curl -LSs "$KERNELSU_SETUP_SOURCE" | bash -s ${{ env.KERNELSU_TAG }}
        KSU_VERSION="_$(cd $(echo "$KERNELSU_SETUP_SOURCE" | cut -d/ -f5) || cd KernelSU && expr $(git rev-list --count HEAD) + 10200)"
        echo "UPLOADNAME=-KernelSU-${{ matrix.target }}$KSU_VERSION" >> $GITHUB_ENV
        if [ ${{ env.KSU_REVERT }} = true ]; then
            git apply $GITHUB_WORKSPACE/patches/KSU_REVERT.patch
        fi

    - name: Setup Configuration for kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel

        BASE_CONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG_BASE }}"
        DEVICE_CONFIG="arch/${{ env.KERNEL_ARCH }}/configs/${{ env.KERNEL_CONFIG_FRAGMENT_DIR }}/${DEVICE}.config"

        if [ ! -f "$BASE_CONFIG" ]; then
            echo "Missing base config: $BASE_CONFIG"
            exit 1
        fi
        if [ ! -f "$DEVICE_CONFIG" ]; then
            echo "Missing device config: $DEVICE_CONFIG"
            exit 1
        fi
        mkdir -p out
        echo "Base config: $BASE_CONFIG"
        echo "Device fragment: $DEVICE_CONFIG"

        # 4.19 uses a common MT6768 base config plus the device-specific fragment.
        # The experimental ZRAM profile adds its own isolated fragment; the normal
        # device defconfig remains unchanged.
        if [ "${ZRAM_MULTICOMP_AUDIT:-false}" = "true" ]; then
            if [ "$DEVICE" != "merlin" ] || [ "${KERNEL_ARCH}" != "arm64" ]; then
                echo "ZRAM multicomp audit is restricted to the merlin ARM64 target"
                exit 1
            fi
            # Do not gate inherited feature branches by their names. The source-level
            # audit below verifies the actual ZRAM multicomp/auto-recompress implementation.
            MULTICOMP_CONFIG="arch/${KERNEL_ARCH}/configs/vendor/mt6768_multicomp.config"
            if [ ! -f "$MULTICOMP_CONFIG" ]; then
                echo "Missing ZRAM multicomp fragment: $MULTICOMP_CONFIG"
                exit 1
            fi
            echo "ZRAM multicomp fragment: $MULTICOMP_CONFIG"
            ./scripts/kconfig/merge_config.sh -m -O out "$BASE_CONFIG" "$DEVICE_CONFIG" "$MULTICOMP_CONFIG"
        else
            ./scripts/kconfig/merge_config.sh -m -O out "$BASE_CONFIG" "$DEVICE_CONFIG"
        fi

        # Experimental 1000 Hz tick profile: merlin only, isolated from other devices.
        if [ "${TICKRATE_1000:-false}" = "true" ]; then
            if [ "$DEVICE" != "merlin" ] || [ "$KERNEL_ARCH" != "arm64" ]; then
                echo "TICKRATE_1000 is restricted to the merlin ARM64 target"
                exit 1
            fi
            TICKRATE_CONFIG="arch/${KERNEL_ARCH}/configs/vendor/mt6768_tickrate_1000.config"
            if [ ! -s "$TICKRATE_CONFIG" ]; then
                echo "Missing or empty HZ=1000 fragment: $TICKRATE_CONFIG"
                exit 1
            fi
            ./scripts/kconfig/merge_config.sh -m -O out out/.config "$TICKRATE_CONFIG"
            echo "Experimental HZ=1000 fragment: $TICKRATE_CONFIG"
        fi

        if [ "${BORE_SCHEDULER:-false}" = "true" ]; then
            if [ "$DEVICE" != "merlin" ] || [ "${KERNEL_ARCH}" != "arm64" ]; then
                echo "BORE scheduler integration is restricted to merlin ARM64"
                exit 1
            fi
            BORE_CONFIG="arch/${KERNEL_ARCH}/configs/vendor/mt6768_bore.config"
            if [ ! -s "$BORE_CONFIG" ]; then
                echo "Missing or empty native BORE config fragment: $BORE_CONFIG"
                exit 1
            fi
            if ! grep -qx 'CONFIG_SCHED_BORE=y' "$BORE_CONFIG"; then
                echo "BORE fragment does not enable CONFIG_SCHED_BORE=y: $BORE_CONFIG"
                exit 1
            fi
            # Merge on top of the already resolved base/device/ZRAM fragments.
            ./scripts/kconfig/merge_config.sh -m -O out out/.config "$BORE_CONFIG"
        fi

        if [ "${DAMON_RECLAIM:-false}" = "true" ] || [ "${DAMON_LRU_SORT:-false}" = "true" ]; then
            if [ "$DEVICE" != "merlin" ] || [ "${KERNEL_ARCH}" != "arm64" ]; then
                echo "DAMON reclaim experiments are restricted to merlin ARM64"
                exit 1
            fi
            DAMON_CONFIG="arch/${KERNEL_ARCH}/configs/vendor/mt6768_damon.config"
            if [ ! -s "$DAMON_CONFIG" ]; then
                echo "Missing DAMON profile fragment: $DAMON_CONFIG"
                exit 1
            fi
            if [ "${DAMON_RECLAIM:-false}" = "true" ] && ! grep -qx 'CONFIG_DAMON_RECLAIM=y' "$DAMON_CONFIG"; then
                echo "DAMON_RECLAIM was requested but the profile does not enable it"
                exit 1
            fi
            if [ "${DAMON_LRU_SORT:-false}" = "true" ] && ! grep -qx 'CONFIG_DAMON_LRU_SORT=y' "$DAMON_CONFIG"; then
                echo "DAMON_LRU_SORT was requested but the profile does not enable it"
                exit 1
            fi
            echo "DAMON profile fragment: $DAMON_CONFIG"
            ./scripts/kconfig/merge_config.sh -m -O out out/.config "$DAMON_CONFIG"
        fi

        CONFIG_FILE="$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/.config"

        # Optional BBRv3 backport as an independent algorithm; classic BBR stays separate.
        # Use BBRv3 by default with FQ pacing; keep other algorithms available where supported.
        if [ -n "${TCP_BBRV3+x}" ]; then
            case "$TCP_BBRV3" in
                true|false) ;;
                *) echo "TCP_BBRV3 must be true or false"; exit 1 ;;
            esac
            grep -q 'config DEFAULT_BBR3' net/ipv4/Kconfig || { echo "BBRv3 default Kconfig choice is missing"; exit 1; }
            grep -q 'config TCP_CONG_BBRV3' net/ipv4/Kconfig || { echo "BBRv3 Kconfig option is missing"; exit 1; }
            grep -q 'CONFIG_TCP_CONG_BBRV3' net/ipv4/Makefile || { echo "BBRv3 Makefile integration is missing"; exit 1; }
            grep -q 'tcp_bbr3_cong_ops' net/ipv4/tcp_bbrv3.c || { echo "BBRv3 congestion-control registration is missing"; exit 1; }
            grep -q 'skb_marked_lost' include/net/tcp.h || { echo "BBRv3 loss-feedback hook is missing"; exit 1; }
            grep -q 'tcp_ca_wants_ce_events' include/net/tcp.h || { echo "BBRv3 ECN feedback hook is missing"; exit 1; }
            if [ "$TCP_BBRV3" = "true" ]; then
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_ADVANCED
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_CUBIC
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_BBR
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_BBRV3
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCHED
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCH_FQ
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCH_DEFAULT
                ./scripts/config --file "$CONFIG_FILE" --enable DEFAULT_FQ
                ./scripts/config --file "$CONFIG_FILE" --enable DEFAULT_BBR3
                ./scripts/config --file "$CONFIG_FILE" --disable DEFAULT_CUBIC
                echo "Requested BBRv3 state: enabled (default)"
            else
                ./scripts/config --file "$CONFIG_FILE" --disable TCP_CONG_BBRV3
                ./scripts/config --file "$CONFIG_FILE" --disable DEFAULT_BBR3
                echo "Requested BBRv3 state: disabled"
            fi
        fi

        # Optional BBR Plus (Linux 4.19 port); FQ is the pacing qdisc.
        if [ -n "${TCP_BBRPLUS+x}" ]; then
            case "$TCP_BBRPLUS" in
                true|false) ;;
                *) echo "TCP_BBRPLUS must be true or false"; exit 1 ;;
            esac
            grep -q 'config TCP_CONG_BBRPLUS' net/ipv4/Kconfig || { echo "BBR Plus Kconfig is missing"; exit 1; }
            grep -q 'CONFIG_TCP_CONG_BBRPLUS' net/ipv4/Makefile || { echo "BBR Plus Makefile integration is missing"; exit 1; }
            if [ "$TCP_BBRPLUS" = "true" ]; then
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_ADVANCED
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_BBR
                ./scripts/config --file "$CONFIG_FILE" --enable TCP_CONG_BBRPLUS
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCHED
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCH_FQ
                ./scripts/config --file "$CONFIG_FILE" --enable NET_SCH_DEFAULT
                ./scripts/config --file "$CONFIG_FILE" --enable DEFAULT_FQ
                echo "Requested BBR Plus state: enabled"
            else
                ./scripts/config --file "$CONFIG_FILE" --disable TCP_CONG_BBRPLUS
                echo "Requested BBR Plus state: disabled"
            fi
        fi

        # SPF is a Builder-controlled feature. Keep the source branch independent
        # from the selected setting; only the resolved Kconfig decides whether it is active.
        if [ -n "${SPECULATIVE_PAGE_FAULT+x}" ]; then
            case "$SPECULATIVE_PAGE_FAULT" in
                true|false) ;;
                *) echo "SPECULATIVE_PAGE_FAULT must be true or false"; exit 1 ;;
            esac
            if [ "$DEVICE" != "merlin" ] || [ "$KERNEL_ARCH" != "arm64" ]; then
                echo "Speculative page faults are currently supported only on merlin ARM64"
                exit 1
            fi
            grep -qx 'config SPECULATIVE_PAGE_FAULT' mm/Kconfig || {
                echo "Source tree does not define CONFIG_SPECULATIVE_PAGE_FAULT"; exit 1;
            }
            grep -q 'select ARCH_SUPPORTS_SPECULATIVE_PAGE_FAULT' arch/arm64/Kconfig || {
                echo "ARM64 source does not advertise speculative page fault support"; exit 1;
            }
            if [ "$SPECULATIVE_PAGE_FAULT" = "true" ]; then
                ./scripts/config --file "$CONFIG_FILE" --enable SPECULATIVE_PAGE_FAULT
                echo "Requested SPF state: enabled"
            else
                ./scripts/config --file "$CONFIG_FILE" --disable SPECULATIVE_PAGE_FAULT
                echo "Requested SPF state: disabled"
            fi
        fi

        if [ "${{ env.ENABLE_KERNELSU }}" = true ]; then
            if [ "${{ env.KSU_HOOKS_PATCH }}" = true ]; then
                git apply $GITHUB_WORKSPACE/patches/KSU_HOOKS_PATCH.patch
                if grep -q '^CONFIG_KSU=' "$CONFIG_FILE"; then
                    sed -i 's/^CONFIG_KSU=.*/CONFIG_KSU=y/' "$CONFIG_FILE"
                else
                    echo 'CONFIG_KSU=y' >> "$CONFIG_FILE"
                fi
            fi
            if [ "${{ env.ADD_KPROBES_CONFIG }}" = true ] && [ "${{ env.KSU_HOOKS_PATCH }}" != true ]; then
                echo 'CONFIG_MODULES=y' >> "$CONFIG_FILE"
                echo 'CONFIG_KPROBES=y' >> "$CONFIG_FILE"
                echo 'CONFIG_HAVE_KPROBES=y' >> "$CONFIG_FILE"
                echo 'CONFIG_KPROBE_EVENTS=y' >> "$CONFIG_FILE"
            fi
        fi

        if [ "${{ env.ADD_OVERLAYFS_CONFIG }}" = true ]; then
            echo 'CONFIG_OVERLAY_FS=y' >> "$CONFIG_FILE"
            echo 'CONFIG_OVERLAY_FS_REDIRECT_DIR=y' >> "$CONFIG_FILE"
            echo 'CONFIG_OVERLAY_FS_INDEX=y' >> "$CONFIG_FILE"
        fi

        if [ "${{ env.ADD_APATCH_SUPPORT }}" = true ]; then
            sed -i 's/^# CONFIG_DEBUG_KERNEL is not set/CONFIG_DEBUG_KERNEL=y/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_DEBUG_KERNEL=n/CONFIG_DEBUG_KERNEL=y/' "$CONFIG_FILE"
            echo 'CONFIG_DEBUG_KERNEL=y' >> "$CONFIG_FILE"
            sed -i 's/^# CONFIG_KALLSYMS is not set/CONFIG_KALLSYMS=y/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_KALLSYMS=n/CONFIG_KALLSYMS=y/' "$CONFIG_FILE"
            echo 'CONFIG_KALLSYMS=y' >> "$CONFIG_FILE"
            sed -i 's/^# CONFIG_KALLSYMS_ALL is not set/CONFIG_KALLSYMS_ALL=y/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_KALLSYMS_ALL=n/CONFIG_KALLSYMS_ALL=y/' "$CONFIG_FILE"
            echo 'CONFIG_KALLSYMS_ALL=y' >> "$CONFIG_FILE"
            sed -i 's/^# CONFIG_KALLSYMS_BASE_RELATIVE is not set/CONFIG_KALLSYMS_BASE_RELATIVE=y/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_KALLSYMS_BASE_RELATIVE=n/CONFIG_KALLSYMS_BASE_RELATIVE=y/' "$CONFIG_FILE"
            echo 'CONFIG_KALLSYMS_BASE_RELATIVE=y' >> "$CONFIG_FILE"
            if [ "${{ env.FIX_APATCH_OPENELA }}" = true ]; then
                git apply $GITHUB_WORKSPACE/patches/FIX_APATCH_OPENELA.patch || {
                    git apply $GITHUB_WORKSPACE/patches/REVERT_ADD_GET_CRED_RCU.patch
                    git apply $GITHUB_WORKSPACE/patches/FIX_APATCH_OPENELA.patch
                }
            fi
        fi

        if [ "${{ env.DISABLE_LTO }}" = true ]; then
            sed -i 's/^CONFIG_LTO=y/CONFIG_LTO=n/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_LTO_CLANG=y/CONFIG_LTO_CLANG=n/' "$CONFIG_FILE"
            sed -i 's/^CONFIG_THINLTO=y/CONFIG_THINLTO=n/' "$CONFIG_FILE"
            echo 'CONFIG_LTO_NONE=y' >> "$CONFIG_FILE"
        fi

        if [ "${{ env.DISABLE_CC_WERROR }}" = true ]; then
            echo 'CONFIG_CC_WERROR=n' >> "$CONFIG_FILE"
        fi

        if [ "${{ env.OLD_ANDROID_SUPPORT }}" = true ]; then
            git apply $GITHUB_WORKSPACE/patches/OLD_ANDROID_SUPPORT.patch
            if grep -q '^CONFIG_MMC_CRYPTO_LEGACY=' "$CONFIG_FILE"; then
                sed -i 's/^CONFIG_MMC_CRYPTO_LEGACY=.*/CONFIG_MMC_CRYPTO_LEGACY=y/' "$CONFIG_FILE"
            else
                echo 'CONFIG_MMC_CRYPTO_LEGACY=y' >> "$CONFIG_FILE"
            fi
        fi

        if [ "${{ env.FIX_WIFI_SPEED }}" = true ]; then
            rm -rf drivers/misc/mediatek/connectivity
            cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel/drivers/misc/mediatek
            git clone https://github.com/Jbub5/connectivity.git --depth=1
            cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        fi

        # Dependency/default resolution is intentionally deferred to the Build kernel step,
        # where the selected compiler and LLVM/GCC arguments are already active.

    - name: Setup ccache
      if: env.ENABLE_CCACHE == 'true'
      uses: hendrikmuhs/ccache-action@v1.2
      with:
        key: build-kernel-${{ env.DEVICE }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}
        max-size: 2G

    - name: Build kernel
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace/android-kernel
        if [ ${{ env.USE_GCC }} = true ]; then
            if [ ${{ env.USE_GCC_64 }} = true ]; then
                export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-64/bin:$PATH
            fi
            if [ ${{ env.USE_GCC_32 }} = true ]; then
                export PATH=$GITHUB_WORKSPACE/kernel_workspace/gcc-32/bin:$PATH
            fi
        elif [ ${{ env.USE_CLANG }} = true ]; then
            export PATH=$GITHUB_WORKSPACE/kernel_workspace/clang/bin:$PATH
        else
            echo "Toolchain not selected"
            exit 1
        fi
        export KBUILD_BUILD_HOST=Github-Action
        export KBUILD_BUILD_USER=$(echo ${{ github.actor }} | tr A-Z a-z)
        if [ -n "${{ env.KSU_EXPECTED_SIZE }}" ] && [ -n "${{ env.KSU_EXPECTED_HASH }}" ]; then
          export KSU_EXPECTED_SIZE=${{ env.KSU_EXPECTED_SIZE }}
          export KSU_EXPECTED_HASH=${{ env.KSU_EXPECTED_HASH }}
        fi
        # Resolve Kconfig with the exact same compiler/tool arguments used for compilation.
        # This prevents --syncconfig from discovering compiler-dependent (NEW) symbols mid-build.
        if [ "${{ env.USE_GCC }}" = "true" ]; then
            make O=out ARCH=${{ env.KERNEL_ARCH }} CC=gcc ${{ env.EXTRA_CMDS }} olddefconfig
        else
            make O=out ARCH=${{ env.KERNEL_ARCH }} CC=clang ${{ env.EXTRA_CMDS }} olddefconfig
        fi

        # Verify the requested SPF state after Kconfig dependency resolution.
        if [ -n "${SPECULATIVE_PAGE_FAULT+x}" ]; then
            case "$SPECULATIVE_PAGE_FAULT" in
                true)
                    grep -qx 'CONFIG_SPECULATIVE_PAGE_FAULT=y' out/.config || {
                        echo "SPF was requested enabled but Kconfig disabled it; check ARCH_HAS_PTE_SPECIAL, MMU and SMP dependencies"
                        exit 1
                    }
                    grep -qx 'CONFIG_ARCH_SUPPORTS_SPECULATIVE_PAGE_FAULT=y' out/.config || {
                        echo "ARM64 did not resolve ARCH_SUPPORTS_SPECULATIVE_PAGE_FAULT=y"; exit 1;
                    }
                    grep -qx 'CONFIG_ARCH_HAS_PTE_SPECIAL=y' out/.config || {
                        echo "SPF dependency ARCH_HAS_PTE_SPECIAL is not enabled"; exit 1;
                    }
                    grep -qx 'CONFIG_MMU=y' out/.config || { echo "SPF dependency MMU is not enabled"; exit 1; }
                    grep -qx 'CONFIG_SMP=y' out/.config || { echo "SPF dependency SMP is not enabled"; exit 1; }
                    echo "PASS: resolved config has CONFIG_SPECULATIVE_PAGE_FAULT=y"
                    ;;
                false)
                    grep -qx '# CONFIG_SPECULATIVE_PAGE_FAULT is not set' out/.config || {
                        echo "SPF was requested disabled but remains enabled after olddefconfig"; exit 1;
                    }
                    echo "PASS: resolved config has CONFIG_SPECULATIVE_PAGE_FAULT disabled"
                    ;;
                *)
                    echo "SPECULATIVE_PAGE_FAULT must be true or false"; exit 1
                    ;;
            esac
        fi

        # Verify the experimental timer profile after Kconfig dependency resolution.
        if [ "${TICKRATE_1000:-false}" = "true" ]; then
            grep -qx 'CONFIG_HZ_1000=y' out/.config || { echo "HZ=1000 was requested but Kconfig did not retain HZ_1000"; exit 1; }
            grep -qx 'CONFIG_HZ=1000' out/.config || { echo "HZ did not resolve to 1000"; exit 1; }
            grep -qx 'CONFIG_NO_HZ_COMMON=y' out/.config || { echo "NO_HZ_COMMON was not retained"; exit 1; }
            grep -qx 'CONFIG_NO_HZ_IDLE=y' out/.config || { echo "NO_HZ_IDLE was not retained"; exit 1; }
            grep -qx 'CONFIG_HIGH_RES_TIMERS=y' out/.config || { echo "HIGH_RES_TIMERS was not retained"; exit 1; }
            grep -qx 'CONFIG_SCHED_HRTICK=y' out/.config || { echo "SCHED_HRTICK was not retained"; exit 1; }
            echo "PASS: HZ=1000 with NO_HZ_IDLE, HIGH_RES_TIMERS and SCHED_HRTICK"
        fi

        # Verify feature fragments survived Kconfig dependency resolution.
        if [ "${BORE_SCHEDULER:-false}" = "true" ]; then
            if ! grep -qx 'CONFIG_SCHED_BORE=y' out/.config; then
                echo "Resolved kernel config does not enable CONFIG_SCHED_BORE=y"
                exit 1
            fi
            echo "PASS: resolved config retains CONFIG_SCHED_BORE=y"
        fi

        if [ "${DAMON_RECLAIM:-false}" = "true" ] || [ "${DAMON_LRU_SORT:-false}" = "true" ]; then
            grep -qx 'CONFIG_DAMON=y' out/.config || { echo "DAMON core was not enabled after olddefconfig"; exit 1; }
            grep -qx 'CONFIG_DAMON_PADDR=y' out/.config || { echo "DAMON physical backend was not enabled (check MMU/MIGRATION dependencies)"; exit 1; }
            grep -qx 'CONFIG_IDLE_PAGE_TRACKING=y' out/.config || { echo "DAMON page-idle tracking dependency was not enabled"; exit 1; }
            if [ "${DAMON_RECLAIM:-false}" = "true" ]; then
                grep -qx 'CONFIG_DAMON_RECLAIM=y' out/.config || { echo "DAMON_RECLAIM was dropped by Kconfig"; exit 1; }
            fi
            if [ "${DAMON_LRU_SORT:-false}" = "true" ]; then
                grep -qx 'CONFIG_DAMON_LRU_SORT=y' out/.config || { echo "DAMON_LRU_SORT was dropped by Kconfig"; exit 1; }
            fi
            grep -q 'damon_reclaim_pages_from_list' mm/vmscan.c || { echo "Node-safe DAMON pageout helper is missing"; exit 1; }
            grep -q 'damon_modules_get_shared_paddr_ctx_target' mm/damon/reclaim.c || { echo "DAMON_RECLAIM is not using the shared PADDR context"; exit 1; }
            grep -q 'damon_modules_get_shared_paddr_ctx_target' mm/damon/lru_sort.c || { echo "DAMON_LRU_SORT is not using the shared PADDR context"; exit 1; }
            grep -q 'damon_commit_schemes_for_actions' mm/damon/core.c || { echo "Policy-scoped DAMOS scheme updates are missing"; exit 1; }
            grep -q 'damon_modules_order_paddr_schemes' mm/damon/modules-common.c || { echo "Deterministic shared policy ordering is missing"; exit 1; }
            grep -q 'deactivate_page_workingset(page)' mm/damon/paddr.c || { echo "Workingset-aware DAMON LRU deactivation is missing"; exit 1; }
            grep -q 'deactivate_page_workingset' include/linux/swap.h || { echo "Workingset-aware LRU helper declaration is missing"; exit 1; }
            grep -q 'lru_deactivate_workingset_pvecs' mm/swap.c || { echo "Dedicated workingset-preserving pagevec is missing"; exit 1; }
            grep -q 'PageActive(page) && page_is_file_cache(page)' mm/vmscan.c || { echo "DAMON direct reclaim does not preserve active file workingset state"; exit 1; }
            echo "PASS: shared DAMON PADDR policies, LRU ordering and workingset integration are present"
        fi


        # Verify BBR Plus and its pacing qdisc after Kconfig dependency resolution.
        if [ -n "${TCP_BBRPLUS+x}" ]; then
            if [ "$TCP_BBRPLUS" = "true" ]; then
                grep -qx 'CONFIG_TCP_CONG_ADVANCED=y' out/.config || { echo "BBR Plus requires TCP_CONG_ADVANCED"; exit 1; }
                grep -qx 'CONFIG_TCP_CONG_BBR=y' out/.config || { echo "Classic BBR support was not retained"; exit 1; }
                grep -qx 'CONFIG_TCP_CONG_BBRPLUS=y' out/.config || { echo "BBR Plus was requested but Kconfig disabled it"; exit 1; }
                grep -qx 'CONFIG_NET_SCH_FQ=y' out/.config || { echo "BBR Plus pacing qdisc FQ was not retained"; exit 1; }
                grep -qx 'CONFIG_DEFAULT_FQ=y' out/.config || { echo "FQ was requested but is not the default qdisc"; exit 1; }
                grep -qx 'CONFIG_DEFAULT_NET_SCH="fq"' out/.config || { echo "Default qdisc did not resolve to FQ"; exit 1; }
                echo "PASS: BBR Plus and FQ pacing qdisc are enabled"
            else
                grep -qx '# CONFIG_TCP_CONG_BBRPLUS is not set' out/.config || { echo "BBR Plus was requested disabled but remains enabled"; exit 1; }
                echo "PASS: optional BBR Plus disabled"
            fi
        fi

        # Verify BBRv3 registration, default selection and FQ pacing after olddefconfig.
        if [ -n "${TCP_BBRV3+x}" ]; then
            case "$TCP_BBRV3" in
                true)
                    grep -qx 'CONFIG_TCP_CONG_BBR=y' out/.config || { echo "Classic BBR fallback was not retained"; exit 1; }
                    grep -qx 'CONFIG_TCP_CONG_BBRV3=y' out/.config || { echo "BBRv3 was requested but Kconfig disabled it"; exit 1; }
                    grep -qx 'CONFIG_DEFAULT_BBR3=y' out/.config || { echo "BBRv3 default selection was dropped by Kconfig"; exit 1; }
                    grep -qx 'CONFIG_DEFAULT_TCP_CONG="bbr3"' out/.config || { echo "Default TCP congestion control is not bbr3"; exit 1; }
                    grep -qx 'CONFIG_NET_SCH_FQ=y' out/.config || { echo "BBRv3 requires FQ pacing support"; exit 1; }
                    grep -qx 'CONFIG_DEFAULT_FQ=y' out/.config || { echo "FQ is not selected as the default qdisc"; exit 1; }
                    grep -qx 'CONFIG_DEFAULT_NET_SCH="fq"' out/.config || { echo "Default qdisc did not resolve to fq"; exit 1; }
                    echo "PASS: BBRv3 is the default TCP congestion control and FQ is the default qdisc"
                    ;;
                false)
                    grep -qx '# CONFIG_TCP_CONG_BBRV3 is not set' out/.config || { echo "BBRv3 was requested disabled but remains built"; exit 1; }
                    grep -qx '# CONFIG_DEFAULT_BBR3 is not set' out/.config || { echo "BBRv3 was requested disabled but remains selected"; exit 1; }
                    ;;
                *)
                    echo "TCP_BBRV3 must be true or false"; exit 1
                    ;;
            esac
        fi

        # Audit the resolved Kconfig after olddefconfig, not just the input fragments.
        if [ "${ZRAM_MULTICOMP_AUDIT:-false}" = "true" ]; then
            bash "$GITHUB_WORKSPACE/audit-zram-multicomp.sh" "$PWD" prebuild
        fi
        if [ "${BORE_SCHEDULER:-false}" = "true" ]; then
            grep -qx 'CONFIG_SCHED_BORE=y' out/.config || { echo "CONFIG_SCHED_BORE is not enabled after olddefconfig"; exit 1; }
            grep -q 'calc_delta_bore_fair' kernel/sched/fair.c || { echo "Native BORE CFS vruntime code is missing"; exit 1; }
            grep -q 'p->policy == SCHED_IDLE' kernel/sched/fair.c || { echo "BORE must preserve SCHED_IDLE's special load weight"; exit 1; }
            grep -q 'ANDROID_KABI_USE(1, u64 burst_time)' include/linux/sched.h || { echo "BORE KABI slot 1 is missing"; exit 1; }
            grep -q 'ANDROID_KABI_USE(2, struct {' include/linux/sched.h || { echo "BORE KABI slot 2 is missing"; exit 1; }
            grep -q 'ANDROID_KABI_USE(3, u32 child_burst_cnt)' include/linux/sched.h || { echo "BORE KABI slot 3 is missing"; exit 1; }
            grep -q 'ANDROID_KABI_USE(4, u64 child_burst_last_cached)' include/linux/sched.h || { echo "BORE KABI slot 4 is missing"; exit 1; }
            grep -q 'sched_post_fork_bore' kernel/sched/core.c || { echo "BORE fork inheritance hook is missing"; exit 1; }
            grep -q 'write_lock_irq(&tasklist_lock)' kernel/sched/core.c || { echo "BORE fork cache updates must be serialized"; exit 1; }
            grep -q 'child == exclude' kernel/sched/core.c || { echo "BORE direct inheritance must exclude the newly forked task"; exit 1; }
            grep -q 'descendant == exclude' kernel/sched/core.c || { echo "BORE atavistic inheritance must exclude the newly forked task"; exit 1; }
            grep -q 'READ_ONCE(p->state) != TASK_NEW' kernel/sched/core.c || { echo "BORE inheritance must ignore concurrent TASK_NEW children"; exit 1; }
            grep -q 'sched_burst_penalty_scale' kernel/sysctl.c || { echo "BORE sysctl controls are missing"; exit 1; }
            grep -q 'sched_post_fork(p);' kernel/fork.c || { echo "BORE post-fork hook is missing from copy_process"; exit 1; }
            awk '/list_add_tail\(&p->sibling, &p->real_parent->children\);/ { linked=NR } /write_unlock_irq\(&tasklist_lock\);/ && linked && !unlocked { unlocked=NR } /sched_post_fork\(p\);/ { called=NR; if (linked && unlocked && linked < unlocked && unlocked < called) ok=1 } END { exit !ok }' kernel/fork.c || { echo "BORE post-fork inheritance must run after child linkage and tasklist unlock"; exit 1; }
        fi


        if [ "${{ env.ENABLE_CCACHE }}" = "true" ]; then
            if [ "${{ env.USE_GCC }}" = "true" ]; then
                make -j$(nproc --all) CC="ccache gcc" O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}
            else
                make -j$(nproc --all) CC="ccache clang" O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}
            fi
        else
            if [ "${{ env.USE_GCC }}" = "true" ]; then
                make -j$(nproc --all) CC=gcc O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}
            else
                make -j$(nproc --all) CC=clang O=out ARCH=${{ env.KERNEL_ARCH }} ${{ env.EXTRA_CMDS }}
            fi
        fi

    - name: Audit ZRAM multicomp build output
      if: env.ZRAM_MULTICOMP_AUDIT == 'true'
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        bash "$GITHUB_WORKSPACE/audit-zram-multicomp.sh" "$PWD" postbuild

    - name: Audit native BORE scheduler build objects
      if: env.BORE_SCHEDULER == 'true'
      run: |
        cd "$GITHUB_WORKSPACE/kernel_workspace/android-kernel"
        test -s out/kernel/sched/fair.o
        test -s out/kernel/sched/core.o

    - name: Check a kernel output files
      run: |
       cd $GITHUB_WORKSPACE/kernel_workspace
       if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} ]; then
           echo "CHECK_FILE_IS_OK=true" >> $GITHUB_ENV
       else
           echo "Kernel output file is empty"
           exit 1
       fi
       if [ ${{ env.NEED_DTBO }} = true ]; then
           if [ -f android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img ]; then
               echo "CHECK_DTBO_IS_OK=true" >> $GITHUB_ENV
           else
               echo "DTBO image is empty"
               exit 1
           fi
       fi

    - name: Upload ZRAM multicomp audit report
      if: env.ZRAM_MULTICOMP_AUDIT == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: zram-multicomp-audit-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/zram-multicomp-audit/*
        if-no-files-found: error

    - name: Patch xxksu Ultra KPM
      if: env.CHECK_FILE_IS_OK == 'true' && env.KPM_SUPPORT == 'true'
      run: |
        OUT_BOOT=$GITHUB_WORKSPACE/kernel_workspace/android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot
        mkdir $GITHUB_WORKSPACE/kernel_workspace/xxksu-Patch
        cd $GITHUB_WORKSPACE/kernel_workspace/xxksu-Patch
        wget ${{ env.KPM_URL }}
        cp $OUT_BOOT/Image ./
        cp $OUT_BOOT/dts/mediatek/mt6768.dtb ./
        chmod +x patch_linux
        ./patch_linux
        mv -f oImage Image
        gzip -k Image
        cat Image.gz *.dtb > Image.gz-dtb
        mv -f Image.gz-dtb $OUT_BOOT/${{ env.KERNEL_IMAGE_NAME }}

    - name: Create flashable Anykernel3 zip
      if: env.CHECK_FILE_IS_OK == 'true' && env.USE_ANYKERNEL3 == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        if [[ ${{ env.ANYKERNEL3_SOURCE }} == *'.tar.gz' ]]; then
            wget -nv -O AnyKernel3.tar.gz ${{ env.ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            tar -C AnyKernel3/ -zxvf AnyKernel3.tar.gz
            rm AnyKernel3.tar.gz
        elif [[ ${{ env.ANYKERNEL3_SOURCE }} == *'.tar.xz' ]]; then
            wget -nv -O AnyKernel3.tar.xz ${{ env.ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            tar -C AnyKernel3/ -Jxvf AnyKernel3.tar.xz
            rm AnyKernel3.tar.xz
        elif [[ ${{ env.ANYKERNEL3_SOURCE }} == *'.tar.zst' ]]; then
            wget -nv -O AnyKernel3.tar.zst ${{ env.ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            tar -C AnyKernel3/ -I zstd -xf AnyKernel3.tar.zst
            rm AnyKernel3.tar.zst
        elif [[ ${{ env.ANYKERNEL3_SOURCE }} == *'.git' ]]; then
            git clone ${{ env.ANYKERNEL3_SOURCE }} -b ${{ env.ANYKERNEL3_BRANCH }} --depth=1 AnyKernel3
        else
            wget -nv -O AnyKernel3.zip ${{ env.ANYKERNEL3_SOURCE }}
            mkdir AnyKernel3
            unzip AnyKernel3.zip -d AnyKernel3/
            rm AnyKernel3.zip
        fi
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} AnyKernel3/
        if [ ${{ env.CHECK_DTBO_IS_OK }} = true ]; then
            cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img AnyKernel3/
        fi
        rm -rf AnyKernel3/.git* AnyKernel3/README.md

    - name: Make boot image
      if: env.HAVE_SOURCE_BOOT_IMAGE == 'true' && env.CHECK_FILE_IS_OK == 'true'
      run: |
        cd $GITHUB_WORKSPACE/kernel_workspace
        tools/unpack_bootimg.py --boot_img boot-source.img
        cp android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }} out/kernel
        tools/mkbootimg.py ${{ env.FORMAT_MKBOOTING }} -o boot.img
        if [ -f boot.img ]; then
            echo "MAKE_BOOT_IMAGE_IS_OK=true" >> $GITHUB_ENV
        else
            echo "Boot image is empty"
            exit 1
        fi

    - name: Export kernel name from defconfig
      run: |
        DEFCONFIG_FILE="kernel_workspace/android-kernel/out/.config"
        RAW_LOCALVERSION=$(grep -oP 'CONFIG_LOCALVERSION="\K[^"]+' "$DEFCONFIG_FILE" || true)
        KERNEL_NAME=$(echo "$RAW_LOCALVERSION" | sed 's/^-//')
        [ -z "$KERNEL_NAME" ] && KERNEL_NAME="CustomKernel"
        echo "KERNEL_LOCALVERSION=${KERNEL_NAME}" >> $GITHUB_ENV

    - name: Upload AnyKernel3
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: ${{ env.ANDROID_TAG }}${{ env.KERNEL_LOCALVERSION }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/AnyKernel3/*

    - name: Upload Kernel Image
      if: env.CHECK_FILE_IS_OK == 'true'
      uses: actions/upload-artifact@v6
      with:        
        name: ${{ env.KERNEL_IMAGE_NAME }}${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/${{ env.KERNEL_IMAGE_NAME }}

    - name: Upload DTBO image
      if: env.CHECK_DTBO_IS_OK == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: dtbo-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/android-kernel/out/arch/${{ env.KERNEL_ARCH }}/boot/dtbo.img

    - name: Upload boot image
      if: env.MAKE_BOOT_IMAGE_IS_OK == 'true'
      uses: actions/upload-artifact@v6
      with:
        name: boot${{ env.LOCALVERSION }}${{ env.UPLOADNAME }}-${{ env.DEVICE }}-${{ env.BUILD_TIME }}
        path: kernel_workspace/boot.img
